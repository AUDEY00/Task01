<!DOCTYPE html>
<html lang="en" ng-app="app">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Unit Directory</title>
    <link rel="stylesheet" href="style.css">
    <!-- AngularJS 1.x -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="StaffController as vm">
    <div class="container">
        <h1>IT Unit Directory</h1>
        <!--Staff form-->
        <form ng-submit="vm.addStaff()">
            <label for="nameInput">Full Name</label>

            <input 
                type="text" 
                id="nameInput" 
                placeholder="Full Name" 
                ng-model="vm.newStaff.name"
            >
            <label for="roleInput">Role</label>
            <input 
                type="text" 
                id="roleInput" 
                placeholder="Role" 
                ng-model="vm.newStaff.role"
            >

            <button type="submit">
                Add Staff
            </button>

        </form>

        <div class="toggle-container">

            <span class="toggle-label">
                {{ vm.showInactiveOnly
                ? 'Showing Inactive Staff'
                : 'Showing Active Staff' }}
            </span>

            <button type="button" class="toggle-switch" ng-class="{ 'active': vm.showInactiveOnly }"
                ng-click="vm.toggleInactive()">
                <span class="toggle-knob"></span>
            </button>

        </div>

        <table>
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr 
                    ng-repeat="staff in vm.staffList track by staff.id" 
                    ng-if="vm.showInactiveOnly === (staff.status === 'Inactive')">

                    <td>
                        {{ staff.name }}
                    </td>

                    <td>
                        {{ staff.role }}
                    </td>


                    <td>

                        <!-- Active badge -->

                        <span class="badge active" ng-show="staff.status === 'Active'">
                            Active
                        </span>

                        <!-- Inactive badge -->

                        <span class="badge inactive" ng-show="staff.status === 'Inactive'">
                            Inactive
                        </span>

                    </td>

                    <td>
                        <button type="button" ng-click="vm.toggleStatus(staff)">
                            {{ staff.status === 'Active'
                            ? 'Deactivate'
                            : 'Activate' }}
                        </button>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <script src="Model/staff.js"></script>
    <script src="Controller/controller.js"></script>

</body>

</html>
