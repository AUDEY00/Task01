<!DOCTYPE html>
<html lang="en" ng-app="app">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Directory - Login</title>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- AngularJS Animate -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>

    <!-- AngularJS Aria -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-aria.min.js"></script>

    <!-- Angular Material CSS -->
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/angular_material/1.2.5/angular-material.min.css">

    <!-- Angular Material -->
    <script src="https://ajax.googleapis.com/ajax/libs/angular_material/1.2.5/angular-material.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

</head>


<body ng-controller="StaffController as vm">

    <div class="login-container">

        <div class="login-card">

            <h1>IT Unit Directory</h1>

            <p class="login-subtitle">
                Sign in to access the Staff Directory
            </p>


            <form ng-submit="vm.login()">

                <!-- Email -->
                <div class="login-field">

                    <label for="emailInput">
                        Email
                    </label>

                    <input type="email" id="emailInput" placeholder="Enter your email" ng-model="vm.loginData.email"
                        required>

                </div>


                <!-- Password -->
                <div class="login-field">

                    <label for="passwordInput">
                        Password
                    </label>

                    <input type="password" id="passwordInput" placeholder="Enter your password"
                        ng-model="vm.loginData.password" required>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-button">

                    Login

                </button>

            </form>

        </div>

    </div>


    <!-- Controller -->
     <script src="../Config/firebase.js"></script>
    <script src="../Controller/auth-controller.js"></script>

</body>

</html>
