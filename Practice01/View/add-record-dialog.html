<md-dialog aria-label="Add Record">

    <form ng-submit="vm.addRecord()">

        <md-toolbar>
            <div class="md-toolbar-tools">
                <h2>
                    Add Record to {{ vm.selectedList.name }}
                </h2>

                <span flex></span>

                <md-button
                    class="md-icon-button"
                    ng-click="vm.cancel()">

                    ✕

                </md-button>
            </div>
        </md-toolbar>


        <md-dialog-content class="md-dialog-content">

            <div
                class="form-group"
                ng-repeat="column in vm.selectedList.columns">

                <label>
                    {{ column.name }}
                </label>


                <!-- TEXT -->

                <input
                    ng-if="column.type === 'text'"
                    type="text"
                    ng-model="vm.record[column.name]"
                    placeholder="Enter {{ column.name }}">


                <!-- NUMBER -->

                <input
                    ng-if="column.type === 'number'"
                    type="number"
                    ng-model="vm.record[column.name]"
                    placeholder="Enter {{ column.name }}">


                <!-- DATE -->

                <input
                    ng-if="column.type === 'date'"
                    type="date"
                    ng-model="vm.record[column.name]">


                <!-- BOOLEAN -->

                <label
                    ng-if="column.type === 'boolean'"
                    class="checkbox-field">

                    <input
                        type="checkbox"
                        ng-model="vm.record[column.name]">

                    <span>
                        {{ column.name }}
                    </span>

                </label>

            </div>

        </md-dialog-content>


        <md-dialog-actions>

            <md-button
                type="button"
                ng-click="vm.cancel()">

                Cancel

            </md-button>


            <md-button
                type="submit"
                class="md-primary">

                Add Record

            </md-button>

        </md-dialog-actions>

    </form>

</md-dialog>
